name: News Archive & Analyze

on:
  schedule:
    # Every 5 minutes — minimum allowed by GitHub Actions.
    # Public repos on free tier: NO usage penalty for schedule triggers.
    # Runs may be delayed 3–10 min at peak (:00/:30); GitHub internally
    # jitters schedule times to reduce congestion.
    - cron: '*/5 * * * *'

  workflow_dispatch:  # manual trigger via GitHub UI

# Prevent overlapping runs — if previous pipeline is still running, skip
concurrency:
  group: cron-pipeline
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news fetch
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120
          echo ""

  analyze:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LLM analysis
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/analyze" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300
          echo ""
