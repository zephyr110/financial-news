name: News Archive & Analyze

on:
  schedule:
    # Daily backup at 21:17 UTC (05:17 Beijing) — QStash schedules are the
    # primary trigger (every 30 min); this backfills anything QStash missed.
    # Note: GitHub Actions schedule is not guaranteed to fire on time.
    - cron: '17 21 * * *'

  workflow_dispatch:  # manual trigger via GitHub UI

# Prevent overlapping runs — if previous pipeline is still running, skip
concurrency:
  group: cron-pipeline
  cancel-in-progress: false

# P1.4 调度解耦：5 段相互独立（无 needs: 链）——
# 一段失败/卡住不阻断其余 4 段；每段 endpoint 自带增量语义 + 唯一约束，幂等可安全重跑。
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger news fetch
        run: |
          curl -sS --fail-with-body -X GET "${{ secrets.APP_URL }}/api/cron/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120
          echo ""

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger LLM analysis
        run: |
          curl -sS --fail-with-body -X GET "${{ secrets.APP_URL }}/api/cron/analyze" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300
          echo ""

  deep-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger deep entity mapping
        run: |
          curl -sS --fail-with-body -X GET "${{ secrets.APP_URL }}/api/cron/deep-analyze" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300
          echo ""

  event-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger event thread detection
        run: |
          curl -sS --fail-with-body -X GET "${{ secrets.APP_URL }}/api/cron/event-threads" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300
          echo ""

  fetch-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch market data + run backtest
        run: |
          curl -sS --fail-with-body -X GET "${{ secrets.APP_URL }}/api/cron/fetch-market" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300
          echo ""
