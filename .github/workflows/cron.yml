name: News Archive & Analyze

on:
  schedule:
    # Every hour at :07 (avoid :00 peak congestion)
    - cron: '7 * * * *'

  workflow_dispatch:  # manual trigger via GitHub UI

# Prevent overlapping runs — if previous pipeline is still running, skip
concurrency:
  group: cron-pipeline
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news fetch
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120
          echo ""

  analyze:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LLM analysis
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/analyze" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300
          echo ""

  deep-analyze:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deep entity mapping
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/deep-analyze" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300
          echo ""

  event-threads:
    needs: deep-analyze
    runs-on: ubuntu-latest
    steps:
      - name: Trigger event thread detection
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/event-threads" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300
          echo ""

  fetch-market:
    needs: event-threads
    runs-on: ubuntu-latest
    steps:
      - name: Fetch market data + run backtest
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/fetch-market" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300
          echo ""
